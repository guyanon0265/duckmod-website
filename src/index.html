<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DuckMod</title>
    <meta property="og:title" content="DuckMod" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://duckmod.pages.dev/" />
    <meta property="og:image" content="https://duckmod.pages.dev/assets/images/java_1.png" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1111" />
    <meta property="og:image:alt" content="A screenshot of a duck mob added inside Minecraft" />
    <meta property="og:description" content="The homepage of DuckMod, an unofficial Minecraft mod and addon" />
    <meta property="og:site_name" content="DuckMod" />
    <link href="assets/icon.png" type="image/png" rel="icon" />
    <script src="js/theme.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <a class="logo" href="index.html"><img src="assets/title.png" alt="DuckMod home" width="720" height="146" /></a>
      <div class="tools">
        <a class="tool" id="github" href="https://github.com/guyanon0265/duckmod-website" target="_blank">GitHub</a>
        <button class="tool" id="theme-toggle" type="button" aria-label="Switch to light mode">Dark</button>
      </div>
    </header>

    <section class="hero" id="hero" aria-label="DuckMod preview" hidden>
      <img id="hero-image" alt="DuckMod screenshot" />
    </section>

    <main>
      <div class="cards">
        <section class="card bedrock" aria-labelledby="heading-bedrock">
          <img class="cicon pix" src="assets/logos/bedrock.png" alt="" width="48" height="48" />
          <p class="eyebrow">Bedrock Edition</p>
          <h2 id="heading-bedrock">Add-On</h2>
          <label for="version">Select version</label>
          <select id="version"></select>
          <p class="note" id="requirement"></p>
          <div class="actions">
            <a class="btn primary" id="download" href="#" download>Download .mcaddon</a>
            <a class="btn" id="github-bedrock" href="https://github.com/guyanon0265/duckmod-addon" target="_blank">View on GitHub</a>
          </div>
        </section>

        <section class="card java" aria-labelledby="heading-java">
          <img class="cicon" src="assets/logos/java.png" alt="" width="48" height="48" />
          <p class="eyebrow">Java Edition</p>
          <h2 id="heading-java">Mod</h2>
          <p class="note">Mod downloads are hosted on Modrinth.<br />Available loaders:<br />Fabric and NeoForge.<br />Requires Minecraft Java 1.21.10+</p>
          <div class="actions">
            <a class="btn" id="modrinth" href="https://modrinth.com/mod/mcduckmod" target="_blank">Get it on Modrinth</a>
          </div>
        </section>
      </div>
    </main>

    <footer>
      <a href="legal.html">Privacy Policy &amp; Disclaimer</a>
    </footer>

    <script src="main.js" type="module"></script>
  </body>
</html>
